name: Affected

on:
  workflow_call:
    outputs:
      docker:
        description: "Affected docker projects"
        value: ${{ jobs.affected.outputs.DOCKER }}
      npm:
        description: "Affected npm projects"
        value: ${{ jobs.affected.outputs.NPM }}
      test:
        description: "Affected test projects"
        value: ${{ jobs.affected.outputs.TEST }}
      e2e:
        description: "Affected e2e projects"
        value: ${{ jobs.affected.outputs.E2E }}

jobs:
  affected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # nx-set-shas looks up the last successful run
    outputs:
      docker: ${{ steps.affected.outputs.DOCKER }}
      npm: ${{ steps.affected.outputs.NPM }}
      test: ${{ steps.affected.outputs.TEST }}
      e2e: ${{ steps.affected.outputs.E2E }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5
      - name: Install nx
        run: |
          node --version
          # --before mirrors minimumReleaseAge in pnpm-workspace.yaml
          npm install --prefix "$RUNNER_TEMP/nx" --no-audit --no-fund --ignore-scripts \
            --before="$(date -u -d '-1 day' +%FT%TZ)" \
            $(jq -r '.devDependencies | "nx@\(.nx) typescript@\(.typescript)"' package.json)
          ln -s "$RUNNER_TEMP/nx/node_modules" node_modules
          # nx's pnpm lockfile parser requires this file; it only reads hoistedDependencies
          echo '{}' > node_modules/.modules.yaml
      - name: Get affected
        id: affected
        run: |
          echo "DOCKER=$(node_modules/.bin/nx show projects --affected --withTarget=docker --json | tail -n 1 | jq -c '.')" >> $GITHUB_OUTPUT
          echo "NPM=$(node_modules/.bin/nx show projects --affected --withTarget=npm --json | tail -n 1 | jq -c '.')" >> $GITHUB_OUTPUT
          echo "TEST=$(node_modules/.bin/nx show projects --affected --withTarget=build,test --json | tail -n 1 | jq -c '.')" >> $GITHUB_OUTPUT
          echo "E2E=$(node_modules/.bin/nx show projects --affected --withTarget=e2e --json | tail -n 1 | jq -c '.')" >> $GITHUB_OUTPUT
